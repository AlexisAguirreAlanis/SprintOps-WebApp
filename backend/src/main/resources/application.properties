spring.application.name=sprintops-backend

# Carga opcional de secretos solo en tu máquina (archivo ignorado por Git). Ahí pon GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET.
spring.config.import=optional:classpath:application-local.properties

# Fotos del daily en cronograma (multipart)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Configuracion del servidor
server.port=8080

# Configuracion de la base de datos MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/sprintops_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Ammy281106
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA/Hibernate (show-sql=false evita miles de líneas en consola por cada request; pon true en application-local si depuras SQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Groq (chatbot Pistache). En local: GROQ_API_KEY o groq.api.key en application-local.properties.
groq.api.key=${GROQ_API_KEY:}
groq.model=meta-llama/llama-4-scout-17b-16e-instruct

# Créditos de SprintOps AI. Se cambian aquí, sin tocar código. El usuario no ve tokens.
sprintops.ai.plans.free=50
sprintops.ai.plans.pro=1000
sprintops.ai.plans.business=3000
sprintops.ai.costs.simple=1
sprintops.ai.costs.search=2
sprintops.ai.costs.summary=3
sprintops.ai.costs.task=5
sprintops.ai.costs.retro=10
sprintops.ai.costs.sprint=15
sprintops.ai.costs.planning=20
sprintops.ai.costs.full=30
# A partir de este costo se muestra la estimación antes de responder.
sprintops.ai.estimate-threshold=5
# 0 cobra solo la tarifa de la acción. Si es mayor que 0, el cobro es el mayor entre la tarifa y los tokens internos divididos por este número.
sprintops.ai.tokens-per-credit=0
# Paquetes de recarga: créditos:precio en pesos MXN. Cambiar este valor no requiere tocar código.
sprintops.ai.packs=250:39,750:99,2000:229,5000:499
# Vacío hasta definir el proveedor y las reglas comerciales. Mientras esté vacío, una recarga solo se registra.
sprintops.ai.payment-provider=
# Costo interno del modelo, en centavos de dólar por millón de tokens. 0 hasta fijar el precio. No se muestra al usuario.
sprintops.ai.cost.input-cents-per-million=0
sprintops.ai.cost.output-cents-per-million=0
# Topes mensuales extra. 0 no agrega un tope: sigue valiendo el saldo de créditos. Se cambian sin tocar código.
sprintops.ai.limit.user-credits=0
sprintops.ai.limit.project-credits=0
sprintops.ai.limit.user-tokens=0
sprintops.ai.limit.project-tokens=0
# Vacío: el registro interno no se puede leer. Si se define, GET /api/ai/observability exige la cabecera X-SprintOps-Observe.
sprintops.ai.observe-key=

# Portadas de cards de proyecto (disco; visibles para todo el equipo)
app.project-card-cover-dir=uploads/project-card-covers

# Telegram: un solo bot para todos (token de @BotFather). Webhook: POST /api/telegram/webhook
